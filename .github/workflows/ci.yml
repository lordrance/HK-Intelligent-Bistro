name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @hk/shared build

      - name: Unit tests
        run: pnpm test

      - name: Typecheck server
        run: pnpm --filter @hk/server exec tsc --noEmit

      - name: Typecheck mobile
        run: pnpm --filter @hk/mobile exec tsc --noEmit
